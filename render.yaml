services:
  - type: web
    name: p2p-telegram-bot
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: TG_TOKEN
        sync: false
      - key: TG_CHAT
        sync: false
      - key: FIREBASE_DB_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: RENDER_EXTERNAL_URL
        sync: false
      - key: MASTER_MNEMONIC
        sync: false
      - key: MASTER_PASSPHRASE
        sync: false
      - key: ETHERSCAN_API_KEY
        sync: false
      - key: TRONGRID_API_KEY
        sync: false
      - key: SOLANA_RPC
        value: https://api.mainnet-beta.solana.com
      - key: DEPOSIT_MIN_CONFIRMATIONS
        value: 3
      - key: DEPOSIT_POLL_MS
        value: 60000
